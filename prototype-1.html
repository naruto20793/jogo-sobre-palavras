<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Protótipo 01 — Editorial claro</title><link rel="stylesheet" href="prototypes.css"><script src="prototypes.js" defer></script></head>
<body class="concept editorial">
<a class="back" href="index.html">← todos os protótipos</a>
<div class="phone-shell">
<header><button aria-label="Abrir ajuda" data-help>?</button><div><b>PALAVRA</b><small>EM FOCO</small></div><button aria-label="Abrir configurações">☷</button></header>
<div class="mode-tabs" role="tablist"><button class="active" role="tab">DESAFIO 301</button><button role="tab" data-unlimited>ILIMITADO</button></div>
<section class="summary"><span>MODERADO</span><p><strong>3ª</strong> de 6 tentativas</p></section>
<section class="word-grid" aria-label="Tentativas">
  <div class="guess row-correct" aria-label="TERMO: todas corretas"><i>T</i><i>E</i><i>R</i><i>M</i><i>O</i></div>
  <div class="guess" aria-label="PALMA: P incorreta, A correta em outra posição"><i class="absent">P</i><i class="present">A</i><i class="absent">L</i><i class="absent">M</i><i class="absent">A</i></div>
  <div class="guess"><i>P</i><i>A</i><i>L</i><i>H</i><i>A</i></div>
  <div class="guess empty"><i></i><i></i><i></i><i></i><i></i></div>
</section>
<section class="semantic"><div><small>PROXIMIDADE</small><strong># 4.230</strong></div><meter min="0" max="100" value="67" aria-label="67 por cento próximo">67%</meter><p>67% próximo</p></section>
<button class="send" id="send">ENVIAR PALPITE</button>
<div class="keyboard" aria-label="Teclado virtual"><button>Q</button><button>W</button><button>E</button><button>R</button><button>T</button><button>Y</button><button>U</button><button>I</button><button>O</button><button>P</button><button>A</button><button>S</button><button>D</button><button>F</button><button>G</button><button class="wide">⌫</button></div>
</div>
<div class="toast" role="status" aria-live="polite"></div>
</body></html>
