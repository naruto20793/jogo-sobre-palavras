<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Protótipo 02 — Ritual vibrante</title><link rel="stylesheet" href="prototypes.css"><script src="prototypes.js" defer></script></head>
<body class="concept playful">
<a class="back" href="index.html">← todos os protótipos</a>
<div class="phone-shell">
<header><button aria-label="Menu">‹</button><div class="day-badge">DIA<br><b>301</b></div><button aria-label="Estatísticas">•••</button></header>
<div class="daily-title"><p>27 DE OUTUBRO</p><h1>Hoje é dia de<br><em>encontrar</em>.</h1></div>
<div class="difficulty-pill"><button class="selected">Fácil</button><button>Médio</button><button>Difícil</button></div>
<section class="hero-board">
  <div class="attempt-label"><span>SUA MELHOR PISTA</span><strong>12ª mais próxima</strong></div>
  <div class="orbit" aria-label="82 por cento de proximidade"><span>82<small>%</small></span></div>
  <div class="word-chip"><b>JARDIM</b><span>Muito próxima</span></div>
</section>
<section class="recent" aria-label="Tentativas recentes">
  <div><span>ÉPOCA</span><b># 20</b></div><div><span>LIVRO</span><b># 31</b></div><div><span>PLANTA</span><b># 8</b></div>
</section>
<button class="send coral" id="send">Continuar tentando <span>→</span></button>
<nav aria-label="Modos"><button class="active">Diário</button><button data-unlimited>Ilimitado</button><button>Ranking</button></nav>
</div>
<div class="toast" role="status" aria-live="polite"></div>
</body></html>
